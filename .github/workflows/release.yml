name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from .csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/Snet.CopilotProxy/Snet.CopilotProxy.csproj
          $ver = $csproj.Project.PropertyGroup.Version
          if (-not $ver) { $ver = "1.0.0" }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore WPF project
        run: dotnet restore src/Snet.CopilotProxy/Snet.CopilotProxy.csproj

      - name: Build WPF (Release)
        run: |
          dotnet publish src/Snet.CopilotProxy/Snet.CopilotProxy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/app

      - name: Install script dependencies
        working-directory: src/Snet.CopilotProxy/script
        run: npm install --production --no-bin-links

      - name: Copy script to publish
        shell: pwsh
        run: |
          $dst = "publish/app/script"
          New-Item -ItemType Directory -Force -Path "$dst/src"
          Copy-Item -Recurse src/Snet.CopilotProxy/script/src/*        "$dst/src/"
          Copy-Item -Recurse src/Snet.CopilotProxy/script/node_modules "$dst/" -ErrorAction SilentlyContinue
          Copy-Item src/Snet.CopilotProxy/script/package.json "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/start.cmd    "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/build.cmd    "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/build-bun.cmd "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/build-node.cmd "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/bunfig.toml  "$dst/" -ErrorAction SilentlyContinue
          Write-Host "Script files copied to $dst"

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path publish/app/* -DestinationPath "publish/CopilotProxy-v${{ steps.version.outputs.VERSION }}.zip"
          Write-Host "ZIP created"

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.VERSION }}" -m "Release v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          files: publish/CopilotProxy-v${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
