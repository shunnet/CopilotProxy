name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [win-x64, win-x86]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from .csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/Snet.CopilotProxy/Snet.CopilotProxy.csproj
          $ver = $csproj.Project.PropertyGroup.Version
          if (-not $ver) { $ver = "1.0.0" }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $ver"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore WPF project
        run: dotnet restore src/Snet.CopilotProxy/Snet.CopilotProxy.csproj -r ${{ matrix.arch }}

      - name: Build WPF (${{ matrix.arch }})
        run: |
          dotnet publish src/Snet.CopilotProxy/Snet.CopilotProxy.csproj `
            -c Release `
            -r ${{ matrix.arch }} `
            --self-contained true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/${{ matrix.arch }}

      - name: Install script dependencies
        working-directory: src/Snet.CopilotProxy/script
        run: npm install --production --no-bin-links

      - name: Copy script to publish (${{ matrix.arch }})
        shell: pwsh
        run: |
          $dst = "publish/${{ matrix.arch }}/script"
          New-Item -ItemType Directory -Force -Path "$dst/src"
          Copy-Item -Recurse src/Snet.CopilotProxy/script/src/*        "$dst/src/"
          Copy-Item -Recurse src/Snet.CopilotProxy/script/node_modules "$dst/" -ErrorAction SilentlyContinue
          Copy-Item src/Snet.CopilotProxy/script/package.json "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/start.cmd    "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/build.cmd    "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/build-bun.cmd "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/build-node.cmd "$dst/"
          Copy-Item src/Snet.CopilotProxy/script/bunfig.toml  "$dst/" -ErrorAction SilentlyContinue

      - name: Create ZIP (${{ matrix.arch }})
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.arch }}/* -DestinationPath "publish/CopilotProxy-v${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.zip"

      - name: Upload artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: CopilotProxy-${{ matrix.arch }}
          path: publish/CopilotProxy-v${{ steps.version.outputs.VERSION }}-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VER=$(grep -oP '<Version>\K[^<]+' src/Snet.CopilotProxy/Snet.CopilotProxy.csproj | head -1)
          echo "VERSION=$VER" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CopilotProxy-*
          path: publish
          merge-multiple: true

      - name: List artifacts
        run: ls -la publish/

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.version.outputs.VERSION }}" -m "Release v${{ steps.version.outputs.VERSION }}"
          git push origin "v${{ steps.version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          files: publish/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
